<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="traceri-gold-logo" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="50%" stop-color="#CFA04E"/>
      <stop offset="100%" stop-color="#936D25"/>
    </linearGradient>
    <linearGradient id="traceri-bg-logo" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="traceri-glow-logo" cx="50" cy="50" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFA04E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CFA04E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Container -->
  <rect width="100" height="100" rx="22" fill="url(#traceri-bg-logo)" stroke="#262C38" stroke-width="2"/>

  <!-- Astrolabe & Coordinate Grid -->
  <circle cx="50" cy="50" r="34" stroke="#202633" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="50" y1="16" x2="50" y2="84" stroke="#202633" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="16" y1="50" x2="84" y2="50" stroke="#202633" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Radial Waypoint Glow -->
  <circle cx="50" cy="50" r="26" fill="url(#traceri-glow-logo)"/>

  <!-- Sweeping Primary Golden Trace -->
  <path d="M 22 74 C 24 38, 44 22, 78 26" stroke="url(#traceri-gold-logo)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Harmonic Resonance Trace -->
  <path d="M 30 78 C 64 74, 76 56, 78 28" stroke="#569CA6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Central Waypoint Anchor Node -->
  <circle cx="50" cy="50" r="6" fill="#FAF8F5" stroke="#CFA04E" stroke-width="2.5"/>

  <!-- Coordinate Markers -->
  <circle cx="68" cy="38" r="3" fill="#CFA04E"/>
  <circle cx="28" cy="64" r="2.5" fill="#76B896"/>
</svg>
